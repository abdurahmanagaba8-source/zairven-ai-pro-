<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>ZAIRVÉN AI PRO | Global Financial Technology</title>
<style>
:root{--bg:#07070a;--panel:#111114;--gold:#d4af37;--gold2:#f3dc8a;--muted:#a39f94;--line:rgba(212,175,55,.24);--line2:rgba(212,175,55,.55);--green:#22c98b;--red:#ff737d;--white:#f6f3ea;--topH:110px;--px:0;--py:0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--topH) + 12px)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a2209 0%,#0b0a07 45%,#050507 85%) fixed;color:var(--white);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}[hidden]{display:none!important}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}

/* INTRO */
.intro{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 45%,#1d1707,#050507 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s,visibility .7s}
.intro.out{opacity:0;visibility:hidden}
.intro svg{width:min(46vw,190px);height:auto;filter:drop-shadow(0 0 18px rgba(212,175,55,.55))}
.intro .ring,.intro .z{fill:none;stroke:url(#g);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.intro .ring{stroke-width:2;animation:draw 1.3s ease forwards}
.intro .z{stroke-width:6;animation:draw 1.4s .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.intro .word{margin-top:26px;padding-left:.35em;font:clamp(26px,7vw,40px) Georgia,serif;letter-spacing:.35em;color:var(--gold2);opacity:0;animation:rise .9s 1.7s forwards}
.intro .sub{margin-top:10px;padding-left:.5em;font-size:11px;letter-spacing:.5em;color:var(--gold);opacity:0;animation:rise .9s 2s forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.skip{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));background:transparent;border:1px solid var(--line);color:var(--gold2);border-radius:30px;padding:10px 22px;font-size:13px;letter-spacing:1px}
.skip:hover{border-color:var(--gold)}

/* TOP BAR */
.top{position:sticky;top:0;z-index:50;background:rgba(7,7,10,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1500px;margin:auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:12px;color:var(--gold2);font:bold 34px Georgia;box-shadow:0 0 22px rgba(212,175,55,.2),inset 0 0 14px rgba(212,175,55,.12);flex:none}
.brand-name{font:24px Georgia,serif;letter-spacing:2px;white-space:nowrap}
.brand-name span{font:11px Inter,sans-serif;letter-spacing:4px;color:var(--gold)}
.brand-sub{font-size:9px;letter-spacing:2.5px;color:var(--muted);margin-top:4px}
.header-actions{display:flex;gap:8px;align-items:center}
.language-select,.account-button{background:#111114;color:var(--gold2);border:1px solid var(--line);border-radius:24px;padding:10px 13px}
.account-button{white-space:nowrap}
.account-wrap{position:relative}
.account-menu{display:none;position:absolute;inset-inline-end:0;top:50px;width:190px;background:#15151a;border:1px solid var(--line);border-radius:14px;padding:8px;z-index:100;box-shadow:0 15px 40px #000c}
.account-menu.open{display:block}
.account-menu button{display:block;width:100%;text-align:start;background:transparent;color:#f1ecd9;border:0;padding:12px;border-radius:8px}
.account-menu button:hover{background:rgba(212,175,55,.12)}
.nav-wrap{border-top:1px solid rgba(212,175,55,.12)}
.nav{max-width:1450px;margin:auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 auto;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;white-space:nowrap}
.nav button .ico{font-size:15px}
.nav button:hover{color:var(--gold2)}
.nav button.active{color:var(--gold2);border-bottom-color:var(--gold)}

/* HERO */
main{max-width:1500px;margin:auto;padding:24px 24px 60px}
.hero{position:relative;min-height:510px;border:1px solid var(--line2);border-radius:25px;overflow:hidden;background:#09080a;box-shadow:0 25px 70px #000b;isolation:isolate}
.hero-art{position:absolute;inset:-4%;z-index:-2;background:radial-gradient(circle at 78% 35%,rgba(212,175,55,.28),transparent 45%),radial-gradient(circle at 20% 90%,rgba(212,175,55,.12),transparent 40%),repeating-linear-gradient(90deg,rgba(212,175,55,.06) 0 1px,transparent 1px 64px),repeating-linear-gradient(0deg,rgba(212,175,55,.06) 0 1px,transparent 1px 64px);transform:translate3d(calc(var(--px)*-10px),calc(var(--py)*-8px),0);transition:transform .3s ease-out}
.candles{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.6}
.candle{position:absolute;transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px),0);transition:transform .3s ease-out}
.c{display:block;position:relative;width:14px;height:var(--h);border:1px solid var(--gold);border-radius:2px;animation:bob 6s ease-in-out infinite alternate}
.c::before{content:"";position:absolute;left:50%;top:-16px;bottom:-16px;width:1px;background:var(--gold);transform:translateX(-50%)}
.c.up{background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 16px rgba(212,175,55,.45)}
.c.dn{background:rgba(212,175,55,.06)}
@keyframes bob{to{transform:translateY(-16px)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,7,10,.9) 0%,rgba(7,7,10,.55) 45%,transparent 80%);z-index:-1;pointer-events:none}
.hero-content{position:relative;max-width:630px;padding:58px 42px 35px}
.eyebrow{font-size:11px;letter-spacing:5px;color:var(--gold2);font-weight:700}
.hero h1{font:clamp(40px,6vw,74px)/1 Georgia,serif;letter-spacing:-1px;margin:18px 0 15px;text-shadow:0 5px 24px #000}
.hero h1 span:last-child{color:var(--gold2)}
.hero p{max-width:490px;color:#ddd8c6;font-size:16px;line-height:1.75}
.hero-pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.pill{border:1px solid var(--line2);border-radius:30px;padding:9px 13px;background:rgba(7,7,10,.7);color:var(--gold2);font-size:10px;letter-spacing:1px}

/* SECTIONS */
.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:34px 0 15px}
.section-head h2{margin:0;font-size:clamp(21px,3vw,29px)}
.section-head p{margin:7px 0 0;color:var(--muted);font-size:13px}
.section-meta{font-size:10px;color:var(--gold2);letter-spacing:2px;border:1px solid var(--line);border-radius:30px;padding:9px 12px;white-space:nowrap}
.grid{display:grid;gap:14px}
.market-grid,.stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.system-grid{grid-template-columns:repeat(3,1fr)}
.card{position:relative;border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(145deg,rgba(28,24,14,.88),rgba(12,12,15,.95) 68%);box-shadow:inset 0 1px rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.45);overflow:hidden;backdrop-filter:blur(12px);transition:transform .25s ease-out,border-color .2s}
.card:hover{border-color:rgba(212,175,55,.65)}
.market-card:before{content:"";position:absolute;width:100px;height:100px;inset-inline-end:-45px;top:-48px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.2),transparent 70%)}
.market-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.symbol{font-weight:750;letter-spacing:.5px}
.type{font-size:9px;letter-spacing:1.5px;color:var(--gold)}
.price{font-size:26px;margin:17px 0 4px;color:var(--gold2)}
.await{font-size:11px;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:20px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.panel-title h2{margin:0;font-size:19px}
.panel-title span{font-size:9px;letter-spacing:2px;color:var(--gold)}
.muted{color:var(--muted);font-size:13px;line-height:1.65}
.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}
.field select,.field input{width:100%;background:#0a0a0d;color:#f6f3ea;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;min-width:0}
.upload{border:1px dashed var(--line2);border-radius:14px;padding:20px;margin-top:14px;text-align:center;background:rgba(212,175,55,.04)}
.upload strong{display:block;color:var(--gold2);margin-bottom:7px}
.upload small{color:var(--muted)}
.upload input{max-width:100%;margin-top:12px;color:var(--muted);font-size:12px}
.gold-btn{width:100%;border:1px solid var(--gold2);border-radius:11px;padding:13px;margin-top:13px;color:#1a1204;font-weight:800;background:linear-gradient(110deg,#a8841f,#f3dc8a,#c49a2a);box-shadow:0 7px 22px rgba(212,175,55,.25)}
.gold-btn:disabled{opacity:.5}
.signal-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.signal-row:last-child{border:0}
.signal-name{font-size:13px;font-weight:700}
.signal-note{font-size:10px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--muted)}
.system-card{min-height:180px}
.system-icon{font-size:27px;color:var(--gold2);margin-bottom:14px}
.system-card h3{margin:0 0 8px;color:var(--gold2);font-size:20px}
.level{display:inline-block;font-size:9px;letter-spacing:1.5px;color:var(--gold);border:1px solid var(--line);border-radius:20px;padding:6px 9px}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font-size:28px;color:var(--gold2);margin:12px 0}
.stat-note{font-size:10px;color:var(--muted)}
.table-wrap{overflow-x:auto}
.history{width:100%;border-collapse:collapse;min-width:580px;font-size:12px}
.history th,.history td{text-align:start;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.history th{color:var(--gold);font-weight:500}
.history td{color:#e4dfcf}
.empty{text-align:center!important;color:var(--muted)!important;padding:25px!important}
.footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;background:rgba(7,7,10,.8)}
.footer strong{display:block;color:var(--gold2);font-size:13px;letter-spacing:4px;margin-bottom:12px}
.notice{font-size:11px;color:var(--muted);line-height:1.55;margin-top:12px}

/* OVERLAYS (login + language) */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(12px);align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.box{width:min(100%,440px);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#1c170b,#0c0c0f);border:1px solid var(--line2);border-radius:22px;padding:25px;box-shadow:0 25px 80px #000}
.box-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.box-top h2{margin:0;color:var(--gold2)}
.auth-close{border:1px solid var(--line);background:#111114;color:var(--gold2);border-radius:50%;width:36px;height:36px}
.auth-tabs{display:flex;gap:8px;margin:15px 0}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#ece6d2}
.auth-tabs button.active{background:rgba(212,175,55,.16);color:var(--gold2)}
.auth-field{margin:13px 0}
.auth-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.auth-field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#09090c;color:#fff;font-size:16px}
.auth-foot{font-size:10px;color:var(--muted);line-height:1.6;margin-top:15px}
.auth-message{font-size:12px;color:var(--gold2);margin-top:12px;line-height:1.5}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.lang-btn{padding:15px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(212,175,55,.05);color:#f1ecd9;font-size:16px}
.lang-btn:hover,.lang-btn.sel{border-color:var(--gold);background:rgba(212,175,55,.16);color:var(--gold2)}

@media(max-width:900px){.market-grid,.stats-grid{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.system-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){
 .header-inner{padding:8px 12px}.brand-mark{width:38px;height:38px;font-size:28px}
 .brand-name{font-size:17px;letter-spacing:1px}.brand-name span{font-size:8px;letter-spacing:2px}.brand-sub{font-size:7px;letter-spacing:1.2px}
 .account-button{font-size:11px;padding:8px 10px}.language-select{padding:8px 6px;font-size:12px}
 .nav{padding:0 6px}.nav button{padding:8px 11px;font-size:11.5px;gap:5px}.nav button .ico{font-size:14px}
 main{padding:14px 12px 38px}.hero{min-height:500px;border-radius:19px}.hero-content{padding:38px 22px 24px}.hero h1{font-size:42px}.hero p{font-size:14px;max-width:340px}
 .market-grid,.stats-grid{gap:9px}.card{padding:14px;border-radius:15px}.price{font-size:22px}
 .section-head{align-items:flex-start}.section-head p{max-width:240px}.section-meta{font-size:8px;padding:8px}
 .field-grid,.system-grid{grid-template-columns:1fr}.signal-row{grid-template-columns:1fr auto}.signal-row .tag:last-child{grid-column:2}.box{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>
</head>

 </div>

</section>

<section class="two-col">
 <div class="card" id="academy"><div class="panel-title"><h2 data-i18n="academyTitle"></h2></div><p class="muted" data-i18n="academyDesc"></p><span class="level" data-i18n="development"></span></div>
 <div class="card" id="newsiq"><div class="panel-title"><h2 data-i18n="newsTitle"></h2></div><p class="muted" data-i18n="newsDesc"></p><span class="level" data-i18n="development"></span></div>

const LANGS=[["en","English"],["ar","العربية"],["sw","Kiswahili"],["fr","Français"],["pt","Português"],["es","Español"]];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
let lang="en",authMode="signin";
const tr=k=>(T[lang]&&T[lang][k])||T.en[k]||"";

/* build dynamic content */
[["EURUSD","FOREX"],["GBPUSD","FOREX"],["XAUUSD","GOLD"],["Volatility 75","SYNTHETIC"]].forEach(([n,t])=>{
 const el=document.createElement("div");el.className="card market-card";
 el.innerHTML='<div class="market-top"><span class="symbol"></span><span class="type"></span></div><div class="price">—</div><div class="await" data-i18n="awaitData"></div>';
 el.querySelector(".symbol").textContent=n;el.querySelector(".type").textContent=t;$("#marketGrid").appendChild(el);
 const row=document.createElement("div");row.className="signal-row";
 row.innerHTML='<div><div class="signal-name"></div><div class="signal-note" data-i18n="awaiting"></div></div><span class="tag">—</span><span class="tag" data-i18n="pending"></span>';
 row.querySelector(".signal-name").textContent=n;$("#signalList").appendChild(row);
});
LANGS.forEach(([c,name])=>{
 const o=document.createElement("option");o.value=c;o.textContent=c.toUpperCase();$("#languageSelect").appendChild(o);
 const b=document.createElement("button");b.className="lang-btn";b.dataset.code=c;b.textContent=name;
 b.addEventListener("click",()=>{applyLanguage(c,true);closeLang()});$("#langGrid").appendChild(b);
});

/* language */
function renderAuth(){const s=authMode==="signup";$("#authTitle").textContent=tr(s?"signup":"authWelcome");$("#authSubtitle").textContent=tr(s?"authSignupDesc":"authSigninDesc");$("#authSubmit").textContent=tr(s?"signup":"signin")}
function applyLanguage(code,save){
 if(!T[code])code="en";lang=code;if(save)store.set("zv_lang",code);
 document.documentElement.lang=code;document.documentElement.dir=code==="ar"?"rtl":"ltr";
 $$("[data-i18n]").forEach(el=>{el.textContent=tr(el.dataset.i18n)});
 $$("[data-ph]").forEach(el=>{el.placeholder=tr(el.dataset.ph)});
 $("#languageSelect").value=code;$("#authClose").setAttribute("aria-label",tr("close"));
 $$(".lang-btn").forEach(b=>b.classList.toggle("sel",b.dataset.code===code));
 renderAuth();setTop();
}
function detect(){const l=(navigator.language||"en").slice(0,2).toLowerCase();return T[l]?l:"en"}
function openLang(){$("#langOverlay").classList.add("open")}
function closeLang(){store.set("zv_lang",lang);$("#langOverlay").classList.remove("open")}
$("#languageSelect").addEventListener("change",e=>applyLanguage(e.target.value,true));
$("#langClose").addEventListener("click",closeLang);
$("#langOverlay").addEventListener("click",e=>{if(e.target.id==="langOverlay")closeLang()});

/* header height for sticky offset */
function setTop(){const t=$(".top");if(t)document.documentElement.style.setProperty("--topH",t.offsetHeight+"px")}
addEventListener("resize",setTop);

const saved=store.get("zv_lang");applyLanguage(saved&&T[saved]?saved:detect(),false);

/* intro */
const intro=$("#intro");let introDone=false;
function afterIntro(){document.body.classList.remove("lock");if(!store.get("zv_lang"))openLang()}
function finishIntro(){if(introDone)return;introDone=true;intro.classList.add("out");setTimeout(()=>{intro.remove();afterIntro()},650)}
let seen=false;try{seen=sessionStorage.getItem("zv_intro")==="1";sessionStorage.setItem("zv_intro","1")}catch(e){}
if(seen||reduced){introDone=true;intro.remove();afterIntro()}else{setTimeout(finishIntro,3800)}
$("#skipIntro")&&$("#skipIntro").addEventListener("click",finishIntro);

/* live particle background */
const cv=$("#bg"),ctx=cv.getContext("2d");let W=0,H=0,P=[];const mouse={x:-9999,y:-9999};
const mk=()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.5+.6});
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);const n=Math.round(Math.min(110,Math.max(38,W*H/16000)));while(P.length<n)P.push(mk());P.length=n}
sizeCanvas();addEventListener("resize",sizeCanvas);
function frame(){
 ctx.clearRect(0,0,W,H);
 for(const p of P){
  const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
  if(d<180&&d>1){p.x+=dx*.012;p.y+=dy*.012}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<0)p.x=W;else if(p.x>W)p.x=0;if(p.y<0)p.y=H;else if(p.y>H)p.y=0;
 }
 for(let i=0;i<P.length;i++){
  const a=P[i];
  ctx.fillStyle="rgba(243,220,138,.8)";ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.283);ctx.fill();
  for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<115){ctx.strokeStyle="rgba(212,175,55,"+(.2*(1-d/115)).toFixed(3)+")";ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
  const md=Math.hypot(a.x-mouse.x,a.y-mouse.y);
  if(md<170){ctx.strokeStyle="rgba(243,220,138,"+(.45*(1-md/170)).toFixed(3)+")";ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mouse.x,mouse.y);ctx.stroke()}
 }
}
function loop(){if(!document.hidden)frame();requestAnimationFrame(loop)}
if(reduced)frame();else loop();

/* pointer: particles follow + parallax */
addEventListener("pointermove",e=>{
 mouse.x=e.clientX;mouse.y=e.clientY;
 const s=document.documentElement.style;s.setProperty("--px",(e.clientX/innerWidth*2-1).toFixed(3));s.setProperty("--py",(e.clientY/innerHeight*2-1).toFixed(3));
},{passive:true});
addEventListener("pointerup",e=>{if(e.pointerType!=="mouse")setTimeout(()=>{mouse.x=mouse.y=-9999},900)});
document.documentElement.addEventListener("mouseleave",()=>{mouse.x=mouse.y=-9999});

/* hero candles */
const cd=$("#candles");
for(let i=0;i<16;i++){
 const w=document.createElement("div");w.className="candle";const up=Math.random()>.42,h=26+Math.random()*70;
 w.style.cssText="left:"+(46+i*3.4)+"%;bottom:"+(12+Math.sin(i/2.2)*14+i*1.6).toFixed(1)+"%;--d:"+(6+Math.random()*22).toFixed(1);
 w.innerHTML='<i class="c '+(up?"up":"dn")+'" style="--h:'+h.toFixed(0)+'px;animation-delay:'+(-Math.random()*6).toFixed(1)+'s"></i>';
 cd.appendChild(w);
}

/* 3D tilt on small cards (desktop only) */
if(matchMedia("(hover:hover) and (pointer:fine)").matches&&!reduced){
 $$(".market-card,.system-card,.stat-card").forEach(c=>{
  c.addEventListener("pointermove",e=>{const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform="perspective(900px) rotateX("+(-y*7).toFixed(2)+"deg) rotateY("+(x*9).toFixed(2)+"deg) translateY(-3px)"});
  c.addEventListener("pointerleave",()=>{c.style.transform=""});
 });
}

/* nav + scroll spy */
const navBtns=$$(".nav button"),navBox=$("#nav");
const targets=navBtns.map(b=>[b,document.getElementById(b.dataset.target)]);
function setActive(btn){navBtns.forEach(b=>b.classList.toggle("active",b===btn));navBox.scrollTo({left:btn.offsetLeft-navBox.clientWidth/2+btn.clientWidth/2,behavior:"smooth"})}
navBtns.forEach(b=>b.addEventListener("click",()=>{setActive(b);const t=document.getElementById(b.dataset.target);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}));
let tick=false,lastActive=navBtns[0];
addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{tick=false;const line=$(".top").offsetHeight+140;let cur=targets[0];targets.forEach(t=>{if(t[1]&&t[1].getBoundingClientRect().top<line)cur=t});if(cur[0]!==lastActive){lastActive=cur[0];setActive(cur[0])}})},{passive:true});

/* chart upload */
const fileInput=$("#chartFile");
fileInput.addEventListener("change",()=>{
 const f=fileInput.files&&fileInput.files[0],pv=$("#chartPreview");
 $("#fileName").textContent=f?tr("selected")+": "+f.name:"";
 if(pv.src&&pv.src.startsWith("blob:"))URL.revokeObjectURL(pv.src);
 if(f&&["image/png","image/jpeg","image/webp"].includes(f.type)){pv.src=URL.createObjectURL(f);pv.hidden=false}else{pv.hidden=true}
});
$("#analyseBtn").addEventListener("click",()=>{const f=fileInput.files&&fileInput.files[0];$("#analysisNotice").textContent=f?tr("chartSelected")+": "+f.name+". "+tr("serviceMissing"):tr("pleaseSelect")});

/* account + auth */
const accountButton=$("#accountButton"),accountMenu=$("#accountMenu"),authOverlay=$("#authOverlay");
accountButton.addEventListener("click",()=>accountMenu.classList.toggle("open"));
document.addEventListener("click",e=>{if(!accountMenu.contains(e.target)&&!accountButton.contains(e.target))accountMenu.classList.remove("open")});
function setAuthMode(m){authMode=m;const s=m==="signup";$("#nameField").hidden=!s;$("#authName").required=s;$("#authPassword").autocomplete=s?"new-password":"current-password";$("#signInTab").classList.toggle("active",!s);$("#signUpTab").classList.toggle("active",s);$("#authMessage").textContent="";renderAuth()}
function openAuth(m){accountMenu.classList.remove("open");authOverlay.classList.add("open");setAuthMode(m)}
$("#menuLogin").addEventListener("click",()=>openAuth("signin"));
$("#menuSignup").addEventListener("click",()=>openAuth("signup"));
$("#menuLanguage").addEventListener("click",()=>{accountMenu.classList.remove("open");openLang()});
$("#signInTab").addEventListener("click",()=>setAuthMode("signin"));
$("#signUpTab").addEventListener("click",()=>setAuthMode("signup"));
$("#authClose").addEventListener("click",()=>authOverlay.classList.remove("open"));
authOverlay.addEventListener("click",e=>{if(e.target===authOverlay)authOverlay.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){authOverlay.classList.remove("open");accountMenu.classList.remove("open");if($("#langOverlay").classList.contains("open"))closeLang()}});
$("#authForm").addEventListener("submit",e=>{e.preventDefault();$("#authMessage").textContent=tr("previewOnly")});
</script>
</body>
</html>
