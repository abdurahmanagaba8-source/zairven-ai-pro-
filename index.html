<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>ZAIRVÉN AI PRO | V22 Dubai Edition</title>
<style>
:root{--ink:#2b2412;--muted:#6f6650;--goldD:#8a6a12;--gold:#d4af37;--gold2:#f3dc8a;--line:rgba(212,175,55,.35);--line2:rgba(212,175,55,.6);--dark:rgba(10,10,15,.7);--green:#1fa971}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(160deg,#fbf3e2 0%,#f4e6c8 45%,#ead7ae 100%) fixed;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== BACKGROUND (soft warm + faint Dubai skyline) ===== */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 85% 8%,rgba(212,175,55,.35),transparent 42%),radial-gradient(circle at 8% 85%,rgba(214,150,110,.22),transparent 45%),radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),transparent 55%)}
.bgfx svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:46vh;fill:rgba(138,106,18,.14)}

/* ===== INTRO ===== */
.intro{position:fixed;inset:0;z-index:1000;overflow:hidden}
.sh{position:absolute;left:0;right:0;height:50.3%;background:#050507;transition:transform .65s cubic-bezier(.77,0,.18,1)}
.sh.t{top:0}.sh.b{bottom:0}
.intro.out .sh.t{transform:translateY(-101%)}
.intro.out .sh.b{transform:translateY(101%)}
.stage{position:absolute;inset:0;z-index:2;--rs:min(40vmin,220px);transition:opacity .2s}
.intro.out .stage{opacity:0}
#stars{position:absolute;inset:0;width:100%;height:100%}
.ringwrap{position:absolute;left:50%;top:50%;width:var(--rs);aspect-ratio:1;opacity:0;transform:translate(-50%,-50%) scale(.3);animation:ringin .6s .1s cubic-bezier(.2,.8,.2,1) forwards,pulse 1.1s .7s ease-in-out infinite}
.ringwrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#000 56%,rgba(212,175,55,.16) 72%,transparent 74%)}
.ringwrap::after{content:"";position:absolute;inset:-28%;border-radius:50%;background:radial-gradient(circle,transparent 52%,rgba(212,175,55,.28) 62%,transparent 75%)}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#f3dc8a,#a8841f,#fff2b8,#7a5f12,#f3dc8a);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:spin 2.4s linear infinite}
@keyframes ringin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 14px rgba(212,175,55,.7))}50%{filter:drop-shadow(0 0 36px rgba(255,226,140,1))}}
@keyframes spin{to{transform:rotate(360deg)}}
.zlogo{position:absolute;left:50%;top:50%;width:calc(var(--rs)*.5);opacity:0;transform:translate(-50%,-50%) scale(.6);filter:drop-shadow(0 0 12px rgba(243,220,138,.9));animation:zin .45s .45s ease-out forwards}
@keyframes zin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.wordwrap{position:absolute;left:0;right:0;top:calc(50% + var(--rs)/2 + 22px);text-align:center}
.word{display:flex;justify-content:center;perspective:700px;perspective-origin:50% calc(-1*(var(--rs)/2 + 22px));font:clamp(28px,8vw,46px) Georgia,serif;color:#f6e7a8}
.word .l{display:block;margin:0 .07em;opacity:0;transform:translateZ(-3200px);animation:fly .4s cubic-bezier(.15,.75,.2,1) forwards;animation-delay:calc(.75s + var(--i)*.075s)}
.word i{display:block;font-style:normal;text-shadow:0 0 14px rgba(212,175,55,.55);animation:land .4s ease-out forwards;animation-delay:calc(.75s + var(--i)*.075s + .36s)}
@keyframes fly{0%{opacity:0;transform:translateZ(-3200px)}35%{opacity:1}100%{opacity:1;transform:translateZ(0)}}
@keyframes land{0%{transform:translate(0,0);text-shadow:0 0 34px #fff2b8,0 0 12px #f3dc8a}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,-1px)}80%{transform:translate(1px,1px)}100%{transform:none;text-shadow:0 0 14px rgba(212,175,55,.55)}}
.sub{margin-top:14px;font-size:11px;letter-spacing:.4em;padding-left:.4em;color:var(--gold);opacity:0;animation:fadein .3s 1.6s forwards}
@keyframes fadein{to{opacity:1}}
.goldline{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,transparent,#f3dc8a 20%,#fff6cf 50%,#f3dc8a 80%,transparent);box-shadow:0 0 18px rgba(243,220,138,.9);transform:scaleX(0);animation:gline .4s 1.95s cubic-bezier(.7,0,.2,1) forwards}
@keyframes gline{to{transform:scaleX(1)}}
.count{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#b8b2a0}
.skip{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));background:none;border:0;color:var(--gold2);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:8px 4px;border-bottom:1px solid transparent}
.skip:hover{border-bottom-color:var(--gold)}

/* ===== TOP BAR (glassy dark, no blur) ===== */
.topbar{position:sticky;top:0;z-index:60;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;background:rgba(10,10,15,.82);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:#f6f3ea;padding:0;min-width:0;text-align:start}
.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:11px;color:var(--gold2);font:bold 29px Georgia;flex:none}
.brand-name{font:21px Georgia,serif;letter-spacing:2px;white-space:nowrap}
.brand-name span{font:10px Inter,sans-serif;letter-spacing:4px;color:var(--gold)}
.top-actions{display:flex;gap:8px;align-items:center}
.language-select{background:rgba(255,255,255,.06);color:var(--gold2);border:1px solid var(--line);border-radius:22px;padding:9px 12px}
.language-select option{color:#222}
.login-btn{background:linear-gradient(110deg,#a8841f,#f3dc8a,#c49a2a);color:#1a1204;font-weight:700;border:0;border-radius:22px;padding:10px 16px;white-space:nowrap}

/* ===== LAYOUT ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:76px minmax(0,1fr) 300px;gap:24px;max-width:1700px;margin:0 auto;padding:24px}
.side{position:sticky;top:88px;height:calc(100vh - 112px);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-radius:16px;background:rgba(10,10,15,.7);border:1px solid var(--line);box-shadow:0 10px 30px rgba(40,30,5,.25);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.side button{position:relative;width:48px;height:48px;display:grid;place-items:center;border:0;border-radius:12px;background:transparent;color:#b9b3a0;transition:.2s}
.side button:hover{color:var(--gold2);background:rgba(212,175,55,.1)}
.side button.active{color:var(--gold2);background:rgba(212,175,55,.18)}
.side button.active::before{content:"";position:absolute;inset-inline-start:-14px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--gold)}
.side .push{margin-top:auto}
main{min-width:0}
.rail{min-width:0}
.rail .card{position:sticky;top:88px}

/* pages: fully hidden when inactive (no ghosting) */
.page{display:none;visibility:hidden;height:0;overflow:hidden}
.page.active{display:block;visibility:visible;height:auto;overflow:visible}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 24px}
.page-head h2{margin:0;font:clamp(26px,3.2vw,36px) Georgia,serif;color:var(--ink)}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:620px}
.tagpill{font-size:10px;letter-spacing:2px;color:var(--goldD);border:1px solid var(--line2);border-radius:30px;padding:8px 12px;white-space:nowrap}
.row{display:grid;gap:24px;margin-top:24px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.narrow{max-width:900px}

/* ===== CARDS (frosted glass) ===== */
.card{position:relative;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink);box-shadow:0 10px 30px rgba(80,60,15,.14),inset 0 1px rgba(255,255,255,.35);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-title h2{margin:0;font-size:19px}
.panel-title span{font-size:9px;letter-spacing:2px;color:var(--goldD)}
.muted{color:var(--muted);font-size:13px;line-height:1.65;margin:0}
.market-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.symbol{font-weight:750;letter-spacing:.5px}
.type{font-size:9px;letter-spacing:1.5px;color:var(--goldD)}
.price{font-size:28px;margin:18px 0 4px;color:var(--ink);font-family:Georgia,serif}
.await{font-size:11px;color:var(--muted)}
.system-icon{font-size:26px;color:var(--goldD);margin-bottom:12px}
.system-card h3{margin:0 0 8px;font-size:19px;color:var(--ink)}
.system-card .muted{margin-top:12px}
.level{display:inline-block;font-size:9px;letter-spacing:1.5px;color:var(--goldD);border:1px solid var(--line2);border-radius:20px;padding:6px 10px}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font-size:28px;color:var(--ink);margin:12px 0;font-family:Georgia,serif}
.stat-note{font-size:10px;color:var(--muted)}
.signal-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid rgba(138,106,18,.15)}
.signal-row:last-child{border:0}
.signal-name{font-size:13px;font-weight:700}
.signal-note{font-size:10px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;border:1px solid var(--line2);border-radius:20px;padding:6px 10px;color:var(--muted)}
.notice{font-size:11px;color:var(--muted);line-height:1.55;margin-top:14px}
.ghost-btn{margin-top:16px;background:transparent;border:1px solid var(--goldD);color:var(--goldD);border-radius:10px;padding:10px 16px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.ghost-btn:hover{background:rgba(138,106,18,.1)}
.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}
.field select,.field input{width:100%;background:rgba(255,255,255,.55);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:16px;min-width:0}
.upload{border:1px dashed var(--goldD);border-radius:14px;padding:22px;margin-top:16px;text-align:center;background:rgba(212,175,55,.08)}
.upload strong{display:block;color:var(--goldD);margin-bottom:7px}
.upload small{color:var(--muted)}
.upload input{max-width:100%;margin-top:12px;color:var(--muted);font-size:12px}
.gold-btn{width:100%;border:1px solid var(--gold2);border-radius:11px;padding:13px;margin-top:14px;color:#1a1204;font-weight:800;background:linear-gradient(110deg,#a8841f,#f3dc8a,#c49a2a);box-shadow:0 7px 22px rgba(212,175,55,.25)}
.table-wrap{overflow-x:auto}
.history{width:100%;border-collapse:collapse;min-width:580px;font-size:12px}
.history th,.history td{text-align:start;padding:13px 10px;border-bottom:1px solid rgba(138,106,18,.15)}
.history th{color:var(--goldD);font-weight:600}
.empty{text-align:center!important;color:var(--muted)!important;padding:26px!important}

/* hero */
.hero{background:linear-gradient(135deg,rgba(14,12,8,.93),rgba(44,34,10,.9));border-color:var(--line2);color:#f6f3ea;padding:40px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(212,175,55,.3),transparent 50%);pointer-events:none}
.hero>*{position:relative}
.badge{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid var(--line2);border-radius:30px;font-size:11px;letter-spacing:.16em;color:var(--gold2);background:rgba(212,175,55,.1)}
.badge b{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.hero h1{font:clamp(32px,4.4vw,56px)/1.05 Georgia,serif;margin:22px 0 16px;letter-spacing:-.5px;max-width:760px}
.hero h1 .a{color:var(--gold2)}
.hero h1 .b{display:block;color:#fff;opacity:.92}
.hero p{max-width:540px;color:#ddd8c6;font-size:15px;line-height:1.75;margin:0}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.pill{border:1px solid var(--line2);border-radius:30px;padding:8px 13px;color:var(--gold2);font-size:10px;letter-spacing:1px}

/* collections rail */
.col-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(138,106,18,.15);font-size:14px}
.col-item:last-child{border:0}
.col-item span:nth-child(2){flex:1}
.col-item b{font-family:Georgia,serif;font-size:18px}
.chk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid rgba(138,106,18,.4);color:rgba(138,106,18,.5);flex:none}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.wl{list-style:none;margin:0;padding:0 0 8px;border-bottom:1px solid rgba(138,106,18,.15)}
.wl li{display:flex;align-items:center;gap:10px;padding:7px 0 7px 8px;font-size:13px;color:var(--muted)}
.wl .chk{width:18px;height:18px;font-size:10px}

/* footer */
.footer{position:relative;z-index:1;text-align:center;padding:26px 20px;background:rgba(10,10,15,.9);color:#b9b3a0;font-size:10px;letter-spacing:2px;line-height:1.9}
.footer strong{display:block;color:var(--gold2);font-size:12px;letter-spacing:3px}

/* overlays (dark modals, no blur) */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.box{width:min(100%,440px);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#1c170b,#0c0c0f);border:1px solid var(--line2);border-radius:20px;padding:25px;color:#f6f3ea;box-shadow:0 25px 80px #000}
.box .muted{color:#b9b3a0}
.box-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.box-top h2{margin:0;color:var(--gold2)}
.auth-close{border:1px solid var(--line);background:#111114;color:var(--gold2);border-radius:50%;width:36px;height:36px}
.auth-tabs{display:flex;gap:8px;margin:15px 0}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#ece6d2}
.auth-tabs button.active{background:rgba(212,175,55,.16);color:var(--gold2)}
.auth-field{margin:13px 0}
.auth-field label{display:block;font-size:12px;color:#b9b3a0;margin-bottom:7px}
.auth-field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#09090c;color:#fff;font-size:16px}
.auth-foot{font-size:10px;color:#b9b3a0;line-height:1.6;margin-top:15px}
.auth-message{font-size:12px;color:var(--gold2);margin-top:12px;line-height:1.5}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lang-btn{padding:15px 10px;border-radius:12px;border:1px solid var(--line2);background:rgba(212,175,55,.08);color:var(--ink);font-size:16px}
.box .lang-btn{color:#f1ecd9}
.lang-btn:hover,.lang-btn.sel{border-color:var(--gold);background:rgba(212,175,55,.22)}

@media(max-width:1180px){
 .app{grid-template-columns:76px minmax(0,1fr)}
 .rail{grid-column:2}
 .rail .card{position:relative;top:0}
}
@media(max-width:900px){.r4{grid-template-columns:repeat(2,minmax(0,1fr))}.r3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
 .topbar{height:56px;padding:0 12px}.brand-mark{width:34px;height:34px;font-size:24px}.brand-name{font-size:16px;letter-spacing:1px}.brand-name span{font-size:8px;letter-spacing:2px}
 .language-select{padding:8px 8px;font-size:12px}.login-btn{padding:9px 12px;font-size:12px}
 .app{grid-template-columns:minmax(0,1fr);gap:20px;padding:16px 12px 96px}
 .rail{grid-column:1}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px max(6px,env(safe-area-inset-bottom));border-radius:16px 16px 0 0;z-index:70}
 .side button{width:40px;height:44px}.side .push{margin-top:0}
 .side button.active::before{inset-inline-start:10px;inset-inline-end:10px;top:auto;bottom:0;width:auto;height:3px}
 .r2,.r3{grid-template-columns:minmax(0,1fr)}
 .r4{gap:12px}.row{gap:16px;margin-top:16px}
 .card{padding:16px}.price{font-size:22px}
 .hero{padding:26px 20px}.hero p{font-size:14px}
 .field-grid{grid-template-columns:1fr}.signal-row{grid-template-columns:1fr auto}.signal-row .tag:last-child{grid-column:2}
 .footer{padding-bottom:90px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

/* intro: warp stars */
function startStars(intro){
 const c=$("#stars"),x=c.getContext("2d");let w=0,h=0;const S=[];
 const d=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*d;h=c.height=innerHeight*d;
 const m=Math.hypot(w,h)/2;
 for(let i=0;i<170;i++)S.push({a:Math.random()*6.2832,r:Math.random()*m,v:.6+Math.random()*1.4});
 const t0=performance.now();
 (function f(now){
  if(!intro.isConnected)return;
  const t=(now-t0)/1000,warp=.7+Math.min(t,2.2)*2.1,cx=w/2,cy=h/2;
  x.clearRect(0,0,w,h);
  for(const s of S){
   const step=s.v*warp*(.6+s.r/m*6),prev=Math.max(0,s.r-step*2.2);s.r+=step;
   if(s.r>m){s.r=Math.random()*40;s.a=Math.random()*6.2832;continue}
   const ca=Math.cos(s.a),sa=Math.sin(s.a),al=Math.min(1,s.r/m*1.6);
   x.strokeStyle="rgba(255,255,255,"+al.toFixed(2)+")";x.lineWidth=(1+s.r/m*1.6)*d*.7;
   x.beginPath();x.moveTo(cx+ca*prev,cy+sa*prev);x.lineTo(cx+ca*s.r,cy+sa*s.r);x.stroke();
  }
  requestAnimationFrame(f);
 })(t0);
}

 introTimer=setTimeout(finishIntro,2350);
 const t0=performance.now(),cnt=$("#count");
 (function tick(now){if(introDone)return;const p=Math.min(1,(now-t0)/2350);cnt.textContent=String(Math.round(p*100)).padStart(3,"0");if(p<1)requestAnimationFrame(tick)})(t0);
}
$("#skipIntro").addEventListener("click",finishIntro);

/* chart upload */
const fileInput=$("#chartFile");
fileInput.addEventListener("change",()=>{
 const f=fileInput.files&&fileInput.files[0],pv=$("#chartPreview");
 $("#fileName").textContent=f?tr("selected")+": "+f.name:"";
 if(pv.src&&pv.src.startsWith("blob:"))URL.revokeObjectURL(pv.src);
 if(f&&["image/png","image/jpeg","image/webp"].includes(f.type)){pv.src=URL.createObjectURL(f);pv.hidden=false}else{pv.hidden=true}
});
$("#analyseBtn").addEventListener("click",()=>{const f=fileInput.files&&fileInput.files[0];$("#analysisNotice").textContent=f?tr("chartSelected")+": "+f.name+". "+tr("serviceMissing"):tr("pleaseSelect")});

/* auth */
const authOverlay=$("#authOverlay");
function setAuthMode(m){authMode=m;const s=m==="signup";$("#nameField").hidden=!s;$("#authName").required=s;$("#authPassword").autocomplete=s?"new-password":"current-password";$("#signInTab").classList.toggle("active",!s);$("#signUpTab").classList.toggle("active",s);$("#authMessage").textContent="";renderAuth()}
$("#loginBtn").addEventListener("click",()=>{authOverlay.classList.add("open");setAuthMode("signin")});
$("#signInTab").addEventListener("click",()=>setAuthMode("signin"));
$("#signUpTab").addEventListener("click",()=>setAuthMode("signup"));
$("#authClose").addEventListener("click",()=>authOverlay.classList.remove("open"));
authOverlay.addEventListener("click",e=>{if(e.target===authOverlay)authOverlay.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){authOverlay.classList.remove("open");if($("#langOverlay").classList.contains("open"))closeLang()}});
$("#authForm").addEventListener("submit",e=>{e.preventDefault();$("#authMessage").textContent=tr("previewOnly")});
</script>
</body>
</html>
