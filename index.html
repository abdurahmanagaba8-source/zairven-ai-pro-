<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZAIRVÉN">
<title>ZAIRVÉN AI PRO</title>
<style>
:root{--ink:#f2eee2;--muted:#9b9788;--gold:#d4af37;--gold2:#ecd488;--line:rgba(212,175,55,.24);--line2:rgba(212,175,55,.5);--green:#1fa971}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(ellipse at 50% -10%,#241d08 0%,#0a0907 45%,#050507 85%) fixed;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}[hidden]{display:none!important}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* live background: slow dust that drifts toward your finger */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sky{position:fixed;left:0;right:0;bottom:0;height:40vh;z-index:0;pointer-events:none}
.sky svg{width:100%;height:100%;fill:rgba(212,175,55,.05)}

/* ===== OPENING ===== */
.intro{position:fixed;inset:0;z-index:1000;overflow:hidden}
.sh{position:absolute;left:0;right:0;height:50.3%;background:#030304;transition:transform .7s cubic-bezier(.77,0,.18,1)}
.sh.t{top:0}.sh.b{bottom:0}
.intro.out .sh.t{transform:translateY(-101%)}
.intro.out .sh.b{transform:translateY(101%)}
.stage{position:absolute;inset:0;z-index:2;transition:opacity .2s}
.intro.out .stage{opacity:0}
.hl{position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.85) 25%,rgba(212,175,55,.85) 75%,transparent);transform:scaleX(0);animation:hl .8s .1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes hl{0%{transform:scaleX(0);opacity:1}60%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.3}}
.mark{position:absolute;left:50%;top:50%;width:clamp(88px,22vw,118px);transform:translate(-50%,-50%);clip-path:inset(0 100% 0 0);animation:wipe .75s .35s cubic-bezier(.7,0,.2,1) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.wordwrap{position:absolute;left:0;right:0;top:calc(50% + clamp(70px,14vw,92px));text-align:center}
.word{display:flex;justify-content:center;font:clamp(24px,6.6vw,38px) Georgia,serif;letter-spacing:.34em;padding-left:.34em;color:#efe8d2}
.word .l{display:block;overflow:hidden;padding:.25em 0 .08em;margin:-.25em 0 -.08em}
.word i{display:block;font-style:normal;transform:translateY(125%);animation:up .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.85s + var(--i)*.05s)}
@keyframes up{to{transform:none}}
.apro{margin-top:12px;font-size:10px;letter-spacing:.5em;padding-left:.5em;color:var(--gold);opacity:0;animation:fadein .5s 1.25s forwards}
@keyframes fadein{to{opacity:1}}
.where{position:absolute;left:0;right:0;bottom:max(30px,calc(env(safe-area-inset-bottom) + 12px));text-align:center;font-size:11px;letter-spacing:.34em;padding-left:.34em;color:#cfc7ad;opacity:0;animation:fadein .5s 1s forwards}
.where b{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:10px;vertical-align:middle}
.count{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#8f8a7a}
.skip{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));background:none;border:0;color:var(--gold2);font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:8px 4px;border-bottom:1px solid transparent}
.skip:hover{border-bottom-color:var(--gold)}

/* ===== TOP BAR ===== */
.topbar{position:sticky;top:0;z-index:60;height:calc(64px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:env(safe-area-inset-top) 24px 0;background:#08080b;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);padding:0;min-width:0;text-align:start}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:10px;color:var(--gold2);font:bold 27px Georgia;flex:none}
.brand-name{font:20px Georgia,serif;letter-spacing:2px;white-space:nowrap}
.brand-name span{font:10px Inter,sans-serif;letter-spacing:4px;color:var(--gold)}
.top-actions{display:flex;gap:8px;align-items:center}
.language-select{background:#121216;color:var(--gold2);border:1px solid var(--line);border-radius:22px;padding:9px 12px}
.language-select option{color:#222}
.login-btn{background:var(--gold);color:#17110a;font-weight:700;border:0;border-radius:22px;padding:10px 16px;white-space:nowrap}

/* ===== LAYOUT ===== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:92px minmax(0,1fr) 300px;gap:24px;max-width:1700px;margin:0 auto;padding:24px}
.side{position:sticky;top:88px;height:calc(100vh - 112px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:16px;background:rgba(10,10,15,.7);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.side button{position:relative;width:76px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:12px;background:transparent;color:#a9a493;transition:.2s;padding:0 2px;min-width:0}
.side .lb{font-size:10.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side button:hover{color:var(--gold2);background:rgba(212,175,55,.08)}
.side button.active{color:var(--gold2);background:rgba(212,175,55,.14)}
.side button.active::before{content:"";position:absolute;inset-inline-start:-8px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--gold)}
.side .push{margin-top:auto}
main{min-width:0}
.rail{min-width:0}
.rail .card{position:sticky;top:88px}

/* search bar */
.searchbox{position:relative;z-index:20;margin:0 0 24px}
.searchbox .i{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gold);pointer-events:none}
.searchbox input{width:100%;-webkit-appearance:none;appearance:none;background:#0e0d0a;border:1px solid var(--line);border-radius:14px;color:var(--ink);padding:14px 16px;padding-inline-start:46px;font-size:16px;outline:0}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{border-color:var(--gold)}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.results{position:absolute;inset-inline:0;top:calc(100% + 8px);background:#0f0d09;border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.65)}
.results button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.06);color:var(--ink);text-align:start;font-size:14px}
.results button:last-child{border-bottom:0}
.results button:hover{background:rgba(212,175,55,.12)}
.results small{color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.results .none{padding:14px 16px;color:var(--muted);font-size:13px}

/* tabs: inactive pages fully hidden */
.page{display:none;visibility:hidden;height:0;overflow:hidden}
.page.active{display:block;visibility:visible;height:auto;overflow:visible}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:0 0 24px}
.page-head h2{margin:0;font:clamp(26px,3.2vw,34px) Georgia,serif;font-weight:400}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:620px}
.tagpill{font-size:10px;letter-spacing:2px;color:var(--gold2);border:1px solid var(--line);border-radius:30px;padding:8px 12px;white-space:nowrap}
.row{display:grid;gap:24px;margin-top:24px}
.r4{grid-template-columns:repeat(4,minmax(0,1fr))}
.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.narrow{max-width:900px}

/* ===== CARDS (frosted glass with a soft light edge) ===== */
.card{position:relative;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(212,175,55,.07) 100%)}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-title h2{margin:0;font:400 20px Georgia,serif}
.muted{color:var(--muted);font-size:13px;line-height:1.65;margin:0}
.market-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.symbol{font-weight:700;letter-spacing:.5px}
.type{font-size:9px;letter-spacing:1.5px;color:var(--gold)}
.price{font:400 28px Georgia,serif;margin:18px 0 4px;color:var(--gold2)}
.await{font-size:11px;color:var(--muted)}
.system-icon{font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--gold);margin-bottom:14px}
.system-card h3{margin:0 0 10px;font:400 22px Georgia,serif;letter-spacing:1px;color:var(--ink)}
.system-card .muted{margin-top:12px}
.level{display:inline-block;font-size:9px;letter-spacing:1.5px;color:var(--gold);border:1px solid var(--line2);border-radius:20px;padding:6px 10px}
.level.dim{color:var(--muted);border-color:rgba(255,255,255,.18);margin-inline-start:8px}
.stat-label{font-size:11px;color:var(--muted)}
.stat-value{font:400 28px Georgia,serif;color:var(--gold2);margin:12px 0}
.stat-note{font-size:10px;color:var(--muted)}
.signal-row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.signal-row:last-child{border:0}
.signal-name{font-size:13px;font-weight:700}
.signal-note{font-size:10px;color:var(--muted);margin-top:4px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:6px 10px;color:var(--muted)}
.notice{font-size:11px;color:var(--muted);line-height:1.55;margin-top:14px}
.ghost-btn{margin-top:16px;background:transparent;border:1px solid var(--line2);color:var(--gold2);border-radius:10px;padding:10px 16px;font-size:11px;letter-spacing:1.8px;text-transform:uppercase}
.ghost-btn:hover{background:rgba(212,175,55,.1)}
.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:7px}
.field select,.field input{width:100%;background:#0a0a0d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;min-width:0}
.upload{border:1px dashed var(--line2);border-radius:14px;padding:22px;margin-top:16px;text-align:center}
.upload strong{display:block;color:var(--gold2);margin-bottom:7px;font-weight:600}
.upload small{color:var(--muted)}
.upload input{max-width:100%;margin-top:12px;color:var(--muted);font-size:12px}
.gold-btn{width:100%;border:0;border-radius:10px;padding:13px;margin-top:14px;color:#17110a;font-weight:700;background:var(--gold)}
.table-wrap{overflow-x:auto}
.history{width:100%;border-collapse:collapse;min-width:580px;font-size:12px}
.history th,.history td{text-align:start;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.history th{color:var(--gold);font-weight:600}
.history td{color:#e4dfcf}
.empty{text-align:center!important;color:var(--muted)!important;padding:26px!important}

/* hero with the 3D ring: ring on the right on big screens, own space above the text on phones */
.hero{padding:0;overflow:hidden;min-height:480px;background:linear-gradient(120deg,#0a0906,#16110a);border-color:var(--line2);-webkit-backdrop-filter:none;backdrop-filter:none}
.hero::before{display:none}
.ringhost{position:absolute;inset:0;z-index:0}
.hero-in{position:relative;z-index:1;max-width:560px;padding:46px 42px}
.loc{display:inline-flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 14px;border:1px solid var(--line2);border-radius:30px;font-size:10.5px;letter-spacing:.16em;color:var(--gold2)}
.loc b{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.hero h1{font:400 clamp(34px,4.6vw,58px)/1.06 Georgia,serif;margin:26px 0 16px;letter-spacing:-.5px}
.hero h1 .a{color:var(--gold2);font-style:italic}
.hero p{max-width:470px;color:#d6d1bf;font-size:15px;line-height:1.75;margin:0}
.hero-line{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:26px;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.hero-line span+span::before{content:"·";margin-right:18px;color:var(--gold)}

/* time card */
.clock{margin-top:26px;width:min(100%,300px);background:rgba(8,8,11,.62);border:1px solid var(--line2);border-radius:16px;padding:16px 20px}
.clock .t{font:300 clamp(34px,9vw,42px)/1.1 Inter,-apple-system,"Segoe UI",sans-serif;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--gold2);direction:ltr;text-align:start}
.clock .d{margin-top:10px;font-size:11.5px;letter-spacing:.06em;line-height:1.5;color:var(--muted)}
.clock .c{margin-top:2px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

/* loyalty rewards: Classic and VIP badges */
.tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px}
.tier{position:relative;border:1px solid var(--line2);border-radius:14px;padding:20px;background:rgba(255,255,255,.03)}
.tier.vip{border-color:rgba(236,212,136,.8);background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.04) 60%)}
.tier .badge{width:34px;height:34px;fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.tier.vip .badge{stroke:var(--gold2)}
.tier .badge .st{fill:var(--gold2);stroke:none}
.tier .tn{margin:14px 0 6px;font:400 22px Georgia,serif;letter-spacing:.12em;color:var(--ink)}
.tier.vip .tn{color:var(--gold2)}
.tier .rule{font-size:13px;color:var(--muted)}
.tier .gift{margin:10px 0 14px;font-size:15px;color:var(--gold2)}

/* collections */
.col-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.col-item:last-child{border:0}
.col-item span:nth-child(2){flex:1}
.col-item b{font:400 18px Georgia,serif;color:var(--gold2)}
.chk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.3);flex:none}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.wl{list-style:none;margin:0;padding:0 0 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.wl li{display:flex;align-items:center;gap:10px;padding:7px 0 7px 8px;font-size:13px;color:var(--muted)}
.wl .chk{width:18px;height:18px;font-size:10px}

.footer{position:relative;z-index:1;text-align:center;padding:26px 20px;background:#08080b;border-top:1px solid var(--line);color:var(--muted);font-size:10px;letter-spacing:2px;line-height:1.9}
.footer strong{display:block;color:var(--gold2);font-size:11px;letter-spacing:3px;font-weight:600}

/* overlays */
.overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:18px}
.overlay.open{display:flex}
.box{width:min(100%,440px);max-height:90vh;overflow:auto;background:#100d07;border:1px solid var(--line2);border-radius:18px;padding:25px;color:var(--ink);box-shadow:0 25px 80px #000}
.box-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.box-top h2{margin:0;font:400 22px Georgia,serif;color:var(--gold2)}
.auth-close{border:1px solid var(--line);background:#111114;color:var(--gold2);border-radius:50%;width:36px;height:36px}
.auth-tabs{display:flex;gap:8px;margin:15px 0}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#ece6d2}
.auth-tabs button.active{background:rgba(212,175,55,.14);color:var(--gold2)}
.auth-field{margin:13px 0}
.auth-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.auth-field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#09090c;color:#fff;font-size:16px}
.auth-foot{font-size:10px;color:var(--muted);line-height:1.6;margin-top:15px}
.auth-message{font-size:12px;color:var(--gold2);margin-top:12px;line-height:1.5}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.lang-btn{padding:15px 10px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:16px}
.lang-btn:hover,.lang-btn.sel{border-color:var(--gold);background:rgba(212,175,55,.14);color:var(--gold2)}

@media(max-width:1180px){.app{grid-template-columns:92px minmax(0,1fr)}.rail{grid-column:2}.rail .card{position:relative;top:0}}
@media(max-width:900px){
 .r4{grid-template-columns:repeat(2,minmax(0,1fr))}.r3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero{min-height:0}
 .ringhost{position:relative;inset:auto;height:270px}
 .hero-in{padding-top:6px}
}
@media(max-width:700px){
 .topbar{height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0}.brand-mark{width:34px;height:34px;font-size:24px}.brand-name{font-size:16px;letter-spacing:1px}.brand-name span{font-size:8px;letter-spacing:2px}
 .language-select{padding:8px;font-size:12px}.login-btn{padding:9px 12px;font-size:12px}
 .app{grid-template-columns:minmax(0,1fr);gap:20px;padding:16px 12px 100px}
 .rail{grid-column:1}
 .searchbox{margin-bottom:16px}
 .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-between;gap:0;padding:6px 4px max(6px,env(safe-area-inset-bottom));border-radius:16px 16px 0 0;z-index:70;background:rgba(10,10,15,.92)}
 .side button{flex:1;width:auto;height:54px;min-width:0;gap:3px}
 .side .lb{font-size:9px}
 .side .push{margin-top:0}
 .side button.active::before{inset-inline-start:12px;inset-inline-end:12px;top:auto;bottom:0;width:auto;height:3px}
 .r2,.r3{grid-template-columns:minmax(0,1fr)}
 .tiers{grid-template-columns:minmax(0,1fr)}
 .r4{gap:12px}.row{gap:16px;margin-top:16px}
 .card{padding:16px}.price{font-size:22px}
 .ringhost{height:250px}
 .hero-in{padding:6px 20px 28px}.hero p{font-size:14px}
 .field-grid{grid-template-columns:1fr}.signal-row{grid-template-columns:1fr auto}.signal-row .tag:last-child{grid-column:2}
 .footer{padding-bottom:96px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="sky" aria-hidden="true">
 <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">

  <rect x="40" y="190" width="50" height="110"/><rect x="100" y="150" width="40" height="150"/><rect x="150" y="210" width="60" height="90"/>
  <rect x="220" y="130" width="46" height="170"/><rect x="280" y="180" width="56" height="120"/><rect x="350" y="100" width="34" height="200"/>
  <rect x="400" y="170" width="60" height="130"/><rect x="470" y="140" width="44" height="160"/><rect x="520" y="200" width="30" height="100"/>

/* live background: slow dust that drifts toward your finger or mouse */
const cv=$("#bg"),ctx=cv.getContext("2d");let W=0,H=0,P=[];const mouse={x:-9999,y:-9999};
const mk=()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.3+.5,o:.25+Math.random()*.45});
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);const n=Math.round(Math.min(90,Math.max(36,W*H/18000)));while(P.length<n)P.push(mk());P.length=n}
sizeCanvas();addEventListener("resize",sizeCanvas);
function dust(){
 ctx.clearRect(0,0,W,H);
 for(const p of P){
  const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
  if(d<170&&d>1){p.x+=dx*.01;p.y+=dy*.01}
  p.x+=p.vx;p.y+=p.vy;
  if(p.x<0)p.x=W;else if(p.x>W)p.x=0;if(p.y<0)p.y=H;else if(p.y>H)p.y=0;
  ctx.fillStyle="rgba(236,212,136,"+p.o.toFixed(2)+")";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
 }
}
function dustLoop(){if(!document.hidden)dust();requestAnimationFrame(dustLoop)}
if(reduced)dust();else dustLoop();

/* 3D ring in the hero (Three.js): centred above the text on phones, on the right on big screens */
function initRing(){
 if(typeof THREE==="undefined")return;
 const host=$("#ringHost");let R;
 try{R=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"low-power"})}catch(e){return}
 R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));R.setClearColor(0x000000,0);
 R.domElement.style.cssText="display:block;width:100%;height:100%";host.appendChild(R.domElement);
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,100);cam.position.z=10;
 const group=new THREE.Group(),disc=new THREE.Group();scene.add(group);group.add(disc);
 const U={t:{value:0}};
 const VS="varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}";
 const HALO="varying vec3 vP;uniform float t;void main(){float r=length(vP.xy);float a=atan(vP.y,vP.x);float d=clamp((r-1.0)/1.7,0.0,1.0);float I=pow(1.0-d,2.6)*(0.82+0.18*sin(a*3.0+t*0.7));float e=smoothstep(0.0,0.04,d);vec3 c=mix(vec3(1.0,0.96,0.80),vec3(0.86,0.64,0.14),pow(d,0.6));gl_FragColor=vec4(c,clamp(I*1.5,0.0,1.0)*e);}";
 const DISC="varying vec3 vP;uniform float t;void main(){float r=length(vP.xy);float a=atan(vP.y,vP.x);float u=clamp((r-1.12)/2.68,0.0,1.0);float sw=0.65+0.35*sin(a*5.0-t*1.4+r*5.0);float I=pow(1.0-u,1.6)*sw;float al=smoothstep(0.0,0.06,u)*(1.0-smoothstep(0.55,1.0,u))*I;vec3 c=mix(vec3(1.0,0.93,0.72),vec3(0.55,0.36,0.10),pow(u,0.5));gl_FragColor=vec4(c,clamp(al*1.5,0.0,1.0));}";
 const mat=f=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:f,transparent:true,depthWrite:false,side:THREE.DoubleSide});
 const halo=new THREE.Mesh(new THREE.RingGeometry(.98,2.7,160,1),mat(HALO));halo.position.z=-.3;group.add(halo);
 group.add(new THREE.Mesh(new THREE.CircleGeometry(1,96),new THREE.MeshBasicMaterial({color:0x000000})));
 const dm=new THREE.Mesh(new THREE.RingGeometry(1.12,3.8,200,8),mat(DISC));dm.rotation.x=1.25;disc.add(dm);disc.rotation.z=-.42;
 const N=300,pos=new Float32Array(N*3);
 for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*40;pos[i*3+1]=(Math.random()-.5)*20;pos[i*3+2]=-4-Math.random()*26}
 const sg=new THREE.BufferGeometry();sg.setAttribute("position",new THREE.BufferAttribute(pos,3));
 const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xf2ead0,size:.06,transparent:true,opacity:.7}));scene.add(stars);
 let tx=0,ty=0,lastMove=-99999;
 function size(){
  const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;
  R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  const big=matchMedia("(min-width:901px)").matches;
  if(big){group.position.set(2.9,0,0);group.scale.setScalar(1)}
  else{group.position.set(0,0,0);group.scale.setScalar(Math.min(1,.92*6.89*(w/h)/7.6))}
 }
 new ResizeObserver(size).observe(host);size();
 addEventListener("pointermove",e=>{
  const b=host.getBoundingClientRect();if(!b.width)return;
  tx=Math.max(-1.2,Math.min(1.2,((e.clientX-b.left)/b.width-.5)*2));
  ty=Math.max(-1.2,Math.min(1.2,((e.clientY-b.top)/b.height-.5)*2));
  lastMove=performance.now();
 },{passive:true});
 (function loop(now){
  requestAnimationFrame(loop);
  if(document.hidden||!host.offsetParent)return;
  U.t.value=now/1000*(reduced?.15:1);
  /* follows your finger or mouse; when nobody touches it, it sways gently by itself */
  const idle=reduced||now-lastMove>2200;
  const ax=idle?Math.sin(now/2600)*.5:tx,ay=idle?Math.cos(now/3300)*.28:ty;
  group.rotation.y+=(ax*.4-group.rotation.y)*.05;group.rotation.x+=(ay*.25-group.rotation.x)*.05;
  stars.position.x=-ax*.8;stars.position.y=ay*.5;
  R.render(scene,cam);
 })(0);
}
initRing();

$("#analyseBtn").addEventListener("click",()=>{const f=fileInput.files&&fileInput.files[0];$("#analysisNotice").textContent=f?tr("chartSelected")+": "+f.name+". "+tr("serviceMissing"):tr("pleaseSelect")});

/* auth */
const authOverlay=$("#authOverlay");
function setAuthMode(m){authMode=m;const s=m==="signup";$("#nameField").hidden=!s;$("#authName").required=s;$("#authPassword").autocomplete=s?"new-password":"current-password";$("#signInTab").classList.toggle("active",!s);$("#signUpTab").classList.toggle("active",s);$("#authMessage").textContent="";renderAuth()}
$("#loginBtn").addEventListener("click",()=>{authOverlay.classList.add("open");setAuthMode("signin")});
$("#signInTab").addEventListener("click",()=>setAuthMode("signin"));
$("#signUpTab").addEventListener("click",()=>setAuthMode("signup"));
$("#authClose").addEventListener("click",()=>authOverlay.classList.remove("open"));
authOverlay.addEventListener("click",e=>{if(e.target===authOverlay)authOverlay.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){authOverlay.classList.remove("open");if($("#langOverlay").classList.contains("open"))closeLang()}});
$("#authForm").addEventListener("submit",e=>{e.preventDefault();$("#authMessage").textContent=tr("previewOnly")});
</script>
</body>
